[package]
name = "workbench-domain"
description = "The app's rules: what an agent may do, with no I/O"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
# The line diff behind the reviews of agent edits.
similar = { version = "3", default-features = false }
url = "2"
workbench-foundation = { path = "../workbench-foundation" }

[dev-dependencies]
ts-rs = "12"
