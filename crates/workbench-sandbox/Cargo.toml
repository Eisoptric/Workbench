[package]
name = "workbench-sandbox"
description = "Cross-platform command sandboxing, process-group control, and SSRF-safe public-host resolution"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["brotli", "deflate", "gzip", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
url = "2"
workbench-appcontainer = { path = "../workbench-appcontainer" }
workbench-foundation = { path = "../workbench-foundation" }
workbench-telemetry = { path = "../workbench-telemetry" }

[target.'cfg(unix)'.dependencies]
# Signals a process group without unsafe code.
rustix = { version = "1", default-features = false, features = ["fs", "process", "std"] }

[target.'cfg(windows)'.dependencies]
# Windows has no process groups: a command's processes are found by who started whom, which the system is asked
# through this crate, without unsafe code of the app's own.
sysinfo = { version = "0.40", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
ts-rs = "12"
