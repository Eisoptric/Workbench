[package]
name = "workbench-core"
description = "The agent loop: a model's turns, its tool calls and approvals, hooks, compaction, sub-agents and checkpoints"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23"
futures-util = { version = "0.3", default-features = false }
getrandom = { version = "0.4", features = ["std"] }
http = "1"
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream"] }
rmcp = { version = "3", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
sse-stream = "0.2"
workbench-browser = { path = "../../../workbench-sdk/crates/workbench-browser" }
workbench-computer = { path = "../../../workbench-sdk/crates/workbench-computer" }
workbench-domain = { path = "../workbench-domain" }
workbench-llm = { path = "../workbench-llm" }
workbench-programs = { path = "../../../workbench-sdk/crates/workbench-programs" }
workbench-store = { path = "../workbench-store" }
workbench-telemetry = { path = "../workbench-telemetry" }
workbench-tools = { path = "../workbench-tools" }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
url = "2"

[dev-dependencies]
axum = "0.8"
serde = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
