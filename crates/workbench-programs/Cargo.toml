[package]
name = "workbench-programs"
description = "Resumable SHA-512-verified archive downloader, archive unpacker, and bounded CLI prober"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23"
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
sha2 = "0.11"
tokio = { version = "1", features = ["fs", "io-util", "process", "rt", "time"] }
workbench-foundation = { path = "../workbench-foundation" }
workbench-sandbox = { path = "../workbench-sandbox" }
workbench-telemetry = { path = "../workbench-telemetry" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
